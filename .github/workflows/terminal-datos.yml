# Reemplaza al vigilante: descarga los datos de la terminal en la nube y los publica en la rama «datos».
# No hace falta tener ninguna computadora encendida.
#
#   · Cada 15 min de 7:00 a 15:59 (CDMX, lunes a viernes) ........ modo rápido: cotizaciones, intradía, portafolio
#     (la BMV abre 7:30–14:00 CDMX con el horario de verano de EUA y 8:30–15:00 sin él; se cubren ambos)
#   · 6:20 y 16:40 (CDMX, lunes a viernes) ......................... modo completo: velas, estados, KPIs, noticias, macro
#   · Al editar empresas.txt, noticias.txt, operaciones.csv, etc. en main ... recalcula al momento
#   · Manual: pestaña Actions → «Terminal · datos» → Run workflow
#
# México está en UTC-6 todo el año; los cron de GitHub van en UTC.
name: Terminal · datos

on:
  schedule:
    - cron: '*/15 13-21 * * 1-5'
    - cron: '20 12 * * 1-5'
    - cron: '40 22 * * 1-5'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Qué descargar'
        type: choice
        options: [completo, rapido]
        default: completo
  push:
    branches: [main]
    paths:
      - 'empresas.txt'
      - 'noticias.txt'
      - 'operaciones.csv'
      - 'parametros.json'
      - 'calendario.csv'
      - 'terminal/pipeline/**'
      - '.github/workflows/terminal-datos.yml'

permissions:
  contents: write

# Una corrida a la vez: la rápida espera a que termine la completa en lugar de pisarla.
concurrency:
  group: terminal-datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Datos publicados (rama datos)
        id: previo
        run: |
          mkdir -p _datos
          if git ls-remote --exit-code --heads origin datos >/dev/null 2>&1; then
            git fetch -q --depth=1 origin datos
            git archive --format=tar FETCH_HEAD | tar -x -C _datos
            echo "existe=si" >> "$GITHUB_OUTPUT"
          else
            echo "existe=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: terminal/pipeline/requirements.txt

      - name: Dependencias
        run: pip install -r terminal/pipeline/requirements.txt

      - name: Elegir modo
        id: modo
        run: |
          MODO=rapido
          case "${{ github.event_name }}" in
            workflow_dispatch) MODO="${{ inputs.modo }}" ;;
            schedule) [ "${{ github.event.schedule }}" = '*/15 13-21 * * 1-5' ] || MODO=completo ;;
            push)
              # Si cambió el código del pipeline se recalcula todo; si solo cambiaron archivos del equipo basta el rápido.
              if git fetch -q --depth=1 origin "${{ github.event.before }}" 2>/dev/null && \
                 git diff --name-only FETCH_HEAD HEAD | grep -qE '^(terminal/pipeline/|\.github/workflows/)'; then MODO=completo; fi ;;
          esac
          if [ "${{ steps.previo.outputs.existe }}" = "no" ]; then MODO=completo; fi
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"
          echo "Modo: $MODO"

      - name: Semilla con el histórico de Refinitiv (solo la primera vez)
        if: steps.previo.outputs.existe == 'no'
        run: python terminal/pipeline/actualizar.py --modo semilla --datos _datos/terminal/datos

      - name: Descargar y calcular
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python terminal/pipeline/actualizar.py --modo ${{ steps.modo.outputs.modo }} --datos _datos/terminal/datos

      - name: Resumen
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              e = json.load(open("_datos/terminal/datos/estado.json", encoding="utf-8"))
          except Exception as ex:
              print(f"No hay estado.json ({ex})"); raise SystemExit
          print(f"### Terminal · datos · modo {e['modo']}")
          print(f"- Generado: {e['generado']} · {e['mercado']['texto']} ({e['mercado']['hora_cdmx']} CDMX)")
          print(f"- Fuentes: {', '.join(e['fuentes']) or '—'} · duración {e['duracion_s']} s")
          print(f"- Cobertura: {', '.join(f'{k} {v}' for k, v in e['cobertura'].items()) or '—'}")
          for x in e["errores"]:
              print(f"- ❌ {x}")
          if e["n_avisos"]:
              print(f"- {e['n_avisos']} avisos (ver estado.json)")
          EOF

      - name: Publicar en la rama datos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _datos
          # Un solo commit, sin historia: la rama no crece y main queda limpia.
          git init -q
          git checkout -q -b datos
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Datos de la terminal · ${{ steps.modo.outputs.modo }} · $(TZ=America/Mexico_City date '+%d/%m/%Y %H:%M') CDMX"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" datos
          echo "Publicado en la rama datos"
