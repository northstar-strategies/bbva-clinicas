# Pruebas del pipeline de la terminal (sin red: usan un yfinance simulado).
name: Terminal · pruebas

on:
  pull_request:
    paths: ['terminal/**', 'investigacion/**', '.github/workflows/terminal-*.yml']
  push:
    branches: [main]
    paths: ['terminal/**', 'investigacion/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: terminal/pipeline/requirements.txt
      - run: pip install -r terminal/pipeline/requirements.txt pytest
      - name: Pipeline
        run: python -m pytest terminal/pipeline/pruebas -q
      - name: Servidor MCP
        run: python terminal/mcp/prueba_mcp.py
      - name: Semilla sin red
        run: |
          python terminal/pipeline/actualizar.py --modo semilla --datos /tmp/datos
          test -s /tmp/datos/kpis.json && test -s /tmp/datos/investigacion.json && test -s /tmp/datos/sensibilidad.json
          python - <<'EOF'
          import json
          p = json.load(open("/tmp/datos/portafolio.json"))
          a, s = p["atribucion"], p["serie"][-1]
          assert abs(a["alfa"] - s["activo_acum"]) < 1e-6, (a["alfa"], s["activo_acum"])
          assert abs(a["suma"] - a["alfa"]) < 1e-6
          print(f"Atribución cuadra: alfa {a['alfa'] * 1e4:.1f} pb en {a['dias']} días; tracker: {a.get('verificacion')}")
          EOF
