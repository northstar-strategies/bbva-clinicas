# Pruebas del pipeline de la terminal (sin red: usan un yfinance simulado).
name: Terminal · pruebas

on:
  pull_request:
    paths: ['terminal/**', '.github/workflows/terminal-*.yml']
  push:
    branches: [main]
    paths: ['terminal/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: terminal/pipeline/requirements.txt
      - run: pip install -r terminal/pipeline/requirements.txt pytest
      - name: Pipeline
        run: python -m pytest terminal/pipeline/pruebas -q
      - name: Servidor MCP
        run: python terminal/mcp/prueba_mcp.py
      - name: Semilla sin red
        run: python terminal/pipeline/actualizar.py --modo semilla --datos /tmp/datos && test -s /tmp/datos/kpis.json
