# TEMPORAL: prueba el pipeline de la terminal contra Yahoo Finance real desde la rama de desarrollo.
# Solo lectura: no publica nada. Se borra en cuanto quede verificado.
name: Sonda · terminal
on:
  push:
    branches: [claude/finceptterminal-replication-nj6rne]
    paths: ['.github/workflows/sonda-terminal.yml', 'terminal/pipeline/**']
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r terminal/pipeline/requirements.txt && pip list 2>/dev/null | grep -iE "yfinance|pandas|curl"
      - name: Semilla
        run: python terminal/pipeline/actualizar.py --modo semilla --datos /tmp/d
      - name: Completo (Yahoo real)
        run: python terminal/pipeline/actualizar.py --modo completo --datos /tmp/d
      - name: Rápido (Yahoo real)
        run: python terminal/pipeline/actualizar.py --modo rapido --datos /tmp/d
      - name: Reporte
        if: always()
        shell: python
        run: |
          import json, os, glob
          D = "/tmp/d"
          def j(n, d=None):
              try: return json.load(open(os.path.join(D, n), encoding="utf-8"))
              except Exception as e: return d
          e = j("estado.json", {})
          print("ESTADO", json.dumps({k: e.get(k) for k in ("modo", "fuentes", "cobertura", "errores", "n_avisos", "duracion_s", "mercado")}, ensure_ascii=False))
          for a in (e.get("avisos") or [])[:40]: print("AVISO", a)
          q = (j("cotizaciones.json", {}) or {}).get("q", {})
          for t in ["FEMSAUBD", "GMEXICOB", "PEOLES", "LIVEPOLC1", "MEXTRAC", "IPC", "USDMXN", "UST10", "COBRE"]:
              print("COT", t, json.dumps(q.get(t), ensure_ascii=False)[:260])
          intr = j("intradia.json", {}) or {}
          print("INTRADIA", intr.get("fecha"), {t: len(v) for t, v in list((intr.get("s") or {}).items())[:6]})
          f = (j("fundamentales.json", {}) or {}).get("emisoras", {})
          print("FUND n", len(f))
          for t in ["FEMSAUBD", "GMEXICOB", "GFNORTEO", "Q"]:
              x = f.get(t, {})
              print("FUND", t, {k: x.get(k) for k in ("currency", "financialCurrency", "marketCap", "trailingPE", "priceToBook", "returnOnEquity", "dividendYield", "trailingAnnualDividendYield", "recommendationKey", "numberOfAnalystOpinions", "targetMeanPrice", "sector")})
          for t in ["FEMSAUBD", "GFNORTEO", "GMEXICOB", "VESTA"]:
              est = j(f"estados/{t}.json", {}) or {}
              res = (est.get("resultados") or {})
              print("EST", t, est.get("moneda"), {fr: (v.get("periodos"), sorted(v.get("filas", {}))[:30]) for fr, v in res.items()}, est.get("avisos"))
              bal = (est.get("balance") or {}).get("trimestral") or {}
              print("BAL", t, bal.get("periodos"), sorted(bal.get("filas", {}))[:40])
          k = j("kpis.json", {}) or {}
          for t in ["FEMSAUBD", "GFNORTEO", "GMEXICOB", "Q", "VESTA", "WALMEX", "BOLSAA"]:
              x = (k.get("emisoras") or {}).get(t, {})
              print("KPI", t, x.get("ultimo_trimestre"), x.get("moneda_reporte"), [(y["clave"], y.get("valor"), y.get("mediana_sector")) for y in x.get("kpis", [])])
              print("QVM", t, x.get("qvm"))
          m = (j("multiplos.json", {}) or {}).get("emisoras", {})
          print("MULT n", len(m), json.dumps(m.get("FEMSAUBD"), ensure_ascii=False)[:500])
          c = j("calendario.json", {}) or {}
          print("CAL", len(c.get("eventos", [])), [x for x in c.get("eventos", []) if x.get("fuente") == "Yahoo Finance"][:6])
          print("ANALISTAS", json.dumps((c.get("analistas") or {}).get("FEMSAUBD"), ensure_ascii=False))
          n = (j("noticias.json", {}) or {}).get("items", [])
          from collections import Counter
          print("NOT", len(n), Counter(x.get("origen") for x in n), Counter(x.get("tono") for x in n if x.get("origen") == "google"))
          for x in [y for y in n if y.get("origen") == "google"][:8]: print("NOTI", x["fecha"], x["t"], x["titulo"][:110], "|", x["fuente"])
          mac = (j("macro.json", {}) or {}).get("series", {})
          print("MACRO", {k2: (v["d"][-1], v["c"][-1], len(v["c"]), v.get("fuente")) for k2, v in mac.items()})
          p = j("portafolio.json", {}) or {}
          print("PORT", json.dumps({k2: p.get("actual", {}).get(k2) for k2 in ("valor", "efectivo", "rend_dia", "bench_dia")}), json.dumps((p.get("serie") or [])[-3:])[:900])
          for t in ["FEMSAUBD", "MEXTRAC", "IPC"]:
              v = j(f"velas/{t}.json", {}) or {}
              print("VELAS", t, v.get("fuente"), len(v.get("d", [])), (v.get("d") or [None])[0], (v.get("d") or [None])[-1], v.get("c", [None])[-1], sum(1 for z in v.get("v", []) if z == 0), len(v.get("div", [])))
          print("TAMANOS", {os.path.relpath(p2, D): os.path.getsize(p2) for p2 in sorted(glob.glob(D + "/*.json"))})
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datos-sonda
          path: /tmp/d
          retention-days: 3
