<!DOCTYPE html>
<html lang="es" data-tema="ambar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>North Star Terminal</title>
<meta name="description" content="Terminal financiera del Fondo de Inversión ITESM-BBVA: cotizaciones, fichas con KPIs, portafolio, noticias y macro de las emisoras de la BMV que analiza North Star Strategies. Se actualiza sola con GitHub Actions.">
<meta name="theme-color" content="#050505">
<link rel="icon" type="image/svg+xml" href="../logo%20star.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/terminal.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js" defer></script>
<script src="js/nucleo.js" defer></script>
<script src="js/datos.js" defer></script>
<script src="js/graficas.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/p_panel.js" defer></script>
<script src="js/p_mercado.js" defer></script>
<script src="js/p_emisora.js" defer></script>
<script src="js/p_kpis.js" defer></script>
<script src="js/p_portafolio.js" defer></script>
<script src="js/p_analisis.js" defer></script>
<script src="js/p_varios.js" defer></script>
</head>
<body>
<div class="app">
  <header class="barra">
    <a class="marca" href="#/panel" title="North Star Terminal · inicio">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 2 27.6 18.4 44 24 27.6 29.6 24 46 20.4 29.6 4 24 20.4 18.4Z" fill="currentColor"/><circle cx="24" cy="24" r="3" fill="#000"/></svg>
      NORTH STAR <small>TERMINAL · ITESM-BBVA</small>
    </a>
    <div class="cmd">
      <label class="cmd-caja" for="cmd"><span class="pr">&gt;</span>
        <input id="cmd" autocomplete="off" spellcheck="false" placeholder="Emisora o función: FEMSAUBD KPI, GMEXICOB GP, PORT, EQS, N, AYUDA…" aria-label="Línea de comandos" aria-controls="sug">
        <kbd>/</kbd></label>
      <div class="sug" id="sug" role="listbox" hidden></div>
    </div>
    <span class="estado-bmv" id="bmv"><i></i><span id="bmvTxt">BMV</span></span>
    <div class="reloj"><span>CDMX <b id="hCdmx">--:--</b></span><span class="ny">NY <b id="hNy">--:--</b></span><span class="ldn">LDN <b id="hLdn">--:--</b></span></div>
    <button class="btn sm" id="btnTema" title="Cambiar entre tema ámbar y marino">TEMA</button>
    <a class="btn sm" href="../index.html" title="Tablero del fondo (versión anterior)">TABLERO</a>
  </header>
  <nav class="teclas" id="teclas" aria-label="Funciones"></nav>
  <div class="cinta" aria-label="Cotizaciones">
    <div class="cinta-eti">BMV</div>
    <div class="cinta-vent"><div class="cinta-pista" id="cintaPista"></div></div>
  </div>
  <main class="contenido" id="contenido" tabindex="-1"></main>
  <footer class="pie" id="pie">Cargando…</footer>
</div>
<noscript><p style="padding:20px">La terminal necesita JavaScript.</p></noscript>
</body>
</html>
